services:
  whos-gaff:
    image: ghcr.io/superjosh800/whos-gaff:latest
    container_name: whos-gaff
    restart: unless-stopped
    # Only reachable from this machine; Tailscale Funnel forwards the public traffic.
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - data:/data
    env_file: .env
    environment:
      # Tailscale Funnel is the only thing that can reach the port, and it adds the visitor's
      # address to X-Forwarded-For, so login rate limits can tell visitors apart.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"

volumes:
  data:
    name: whos-gaff
